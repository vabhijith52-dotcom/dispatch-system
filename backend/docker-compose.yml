version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: dispatch_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dispatch_user
      POSTGRES_PASSWORD: dispatch_pass
      POSTGRES_DB: dispatch_db
    ports:
      - "5432:5432"
    volumes:
      - dispatch_pg_data:/var/lib/postgresql/data

volumes:
  dispatch_pg_data:
